<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SS Dashboard v3.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root {
  --bg:     #06070b;
  --panel:  rgba(18,21,32,0.82);
  --panel2: #141720;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text:   #eef0f5;
  --muted:  #828aa0;
  --muted2: #525870;
  --red:    #ff4d5a; --red-dim:    #2a0f14;
  --yellow: #ffbe38; --yellow-dim: #2d2510;
  --green:  #35d48c; --green-dim:  #0a2a1e;
  --blue:   #6c8fff; --blue-dim:   #0f1530;
  --purple: #a46bff; --purple-dim: #1a0d30;
  --fp:     #a0a8b8; --fp-dim:     #14161e;
}
*  { box-sizing: border-box; margin: 0; padding: 0; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #222638; border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }
body {
  font-family: 'Sora', system-ui, sans-serif;
  background: radial-gradient(900px 500px at 10% -10%, rgba(108,143,255,0.13), transparent 55%),
              radial-gradient(600px 400px at 95% 0, rgba(164,107,255,0.10), transparent 50%),
              var(--bg);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
}
.mono { font-family: 'JetBrains Mono', monospace; }
.wrap { max-width: 1220px; margin: auto; padding: 32px 22px 60px; }

/* ── Auth Screen ── */
.auth-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; backdrop-filter: blur(8px);
}
.auth-screen.hidden { display: none; }
.auth-box {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 20px; padding: 40px; width: 90%; max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.auth-box h1 { font-size: 24px; margin-bottom: 8px; }
.auth-box .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
.auth-box input {
  width: 100%; padding: 12px 16px; margin-bottom: 14px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 11px; color: var(--text); font-family: 'Sora';
  font-size: 14px; transition: border-color .15s;
}
.auth-box input:focus { outline: 0; border-color: var(--blue); }
.auth-box .btn { width: 100%; padding: 14px; font-size: 14px; font-weight: 600; }
.auth-box .error { color: var(--red); font-size: 12px; margin-top: 12px; }

/* ── Header ── */
header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; flex-wrap: wrap; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand .logo {
  width: 44px; height: 44px; border-radius: 14px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  box-shadow: 0 0 28px rgba(108,143,255,0.3);
  display: flex; align-items: center; justify-content: center; font-size: 21px;
}
.brand h1   { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.brand .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.user-info {
  display: flex; align-items: center; gap: 12px; color: var(--muted);
  font-size: 12px;
}
.logout-btn {
  padding: 8px 14px; background: transparent; border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; cursor: pointer; font-size: 12px;
  transition: all .15s;
}
.logout-btn:hover { border-color: var(--red); color: var(--red); }

.pills { display: flex; gap: 9px; }
.pill {
  background: var(--panel); border: 1px solid var(--border);
  backdrop-filter: blur(12px); border-radius: 11px;
  padding: 8px 15px; text-align: center; min-width: 68px;
}
.pill .v { font-size: 18px; font-weight: 700; line-height: 1; }
.pill .l { font-size: 10px; color: var(--muted); text-transform: uppercase;
           letter-spacing: .5px; margin-top: 3px; }

/* ── Guide bar ── */
.guide-bar {
  display: flex; align-items: center; gap: 12px;
  background: linear-gradient(135deg, rgba(108,143,255,0.07), rgba(164,107,255,0.05));
  border: 1px solid rgba(108,143,255,0.18); border-radius: 14px;
  padding: 12px 17px; margin-bottom: 18px; cursor: pointer;
  transition: border-color .15s;
}
.guide-bar:hover { border-color: rgba(108,143,255,0.38); }
.guide-bar .title { font-size: 13px; font-weight: 600; }
.guide-bar .sub   { font-size: 11.5px; color: var(--muted); }
.guide-bar .arrow { margin-left: auto; color: var(--muted); font-size: 12px; }

/* ── Toolbar ── */
.toolbar { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
.search {
  flex: 1; min-width: 220px; display: flex; align-items: center; gap: 10px;
  background: var(--panel); backdrop-filter: blur(14px);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 0 14px; transition: border-color .15s;
}
.search:focus-within { border-color: var(--blue); }
.search svg  { flex-shrink: 0; opacity: .45; }
.search input {
  flex: 1; background: transparent; border: 0; outline: 0;
  color: var(--text); font-family: 'Sora'; font-size: 14px; padding: 12px 0;
}
.btn {
  padding: 11px 18px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--panel2); color: var(--text); cursor: pointer;
  font-family: 'Sora'; font-size: 13px; font-weight: 600;
  transition: all .15s; white-space: nowrap;
}
.btn:hover { border-color: var(--border2); transform: translateY(-1px); }
.btn-accent {
  background: linear-gradient(135deg, var(--blue), var(--purple));
  border: none; color: #fff;
  box-shadow: 0 4px 18px rgba(108,143,255,0.28);
}
.btn-accent:hover { box-shadow: 0 6px 24px rgba(108,143,255,0.42); }
.btn-danger {
  background: rgba(255,77,90,0.1);
  border: 1px solid rgba(255,77,90,0.3);
  color: var(--red);
}
.btn-danger:hover {
  background: rgba(255,77,90,0.2);
  border-color: rgba(255,77,90,0.6);
}
.btn-ghost { background: transparent; }

/* ── Main grid ── */
.grid { display: grid; grid-template-columns: 330px 1fr; gap: 18px; align-items: start; }
@media(max-width:860px) { .grid { grid-template-columns: 1fr; } }

.panel { background: var(--panel); backdrop-filter: blur(16px);
         border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }

/* ── List ── */
.list     { max-height: 76vh; overflow-y: auto; }
.list-hd  { padding: 13px 17px; font-size: 10.5px; text-transform: uppercase;
            letter-spacing: .65px; color: var(--muted2); border-bottom: 1px solid var(--border);
            font-weight: 700; }
.item {
  padding: 14px 17px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .13s; position: relative;
  display: flex; align-items: center; justify-content: space-between;
}
.item:hover   { background: rgba(255,255,255,0.03); }
.item.active  { background: rgba(108,143,255,0.07); }
.item.active::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: linear-gradient(var(--blue), var(--purple));
}
.item-content { flex: 1; }
.item .code  { font-weight: 700; font-size: 14px; font-family:'JetBrains Mono';
               letter-spacing: .5px; }
.item .meta  { color: var(--muted); font-size: 11px; margin-top: 4px; }
.item .delete-btn {
  background: transparent; border: none; color: var(--muted);
  cursor: pointer; font-size: 16px; padding: 4px 8px;
  transition: color .15s;
}
.item .delete-btn:hover { color: var(--red); }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 99px; font-size: 10px; font-weight: 700;
  margin-top: 8px; text-transform: uppercase; letter-spacing: .4px;
}
.badge::before { content:''; width:6px; height:6px; border-radius:50%; }
.b-red    { background:var(--red-dim);    color:var(--red);    border:1px solid rgba(255,77,90,.3); }
.b-red::before    { background:var(--red);    box-shadow:0 0 8px var(--red); }
.b-yellow { background:var(--yellow-dim); color:var(--yellow); border:1px solid rgba(255,190,56,.3); }
.b-yellow::before { background:var(--yellow); box-shadow:0 0 8px var(--yellow); }
.b-green  { background:var(--green-dim);  color:var(--green);  border:1px solid rgba(53,212,140,.3); }
.b-green::before  { background:var(--green);  box-shadow:0 0 8px var(--green); }

/* ── Detail panel ── */
.detail { padding: 24px; min-height: 440px; }
.verdict-banner {
  border-radius: 15px; padding: 26px; margin-bottom: 16px;
  text-align: center; position: relative; overflow: hidden;
}
.verdict-banner::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% -10%, currentColor 0%, transparent 65%);
  opacity: .4; pointer-events: none;
}
.vb-red    { background: linear-gradient(150deg,#280d12,#180709);
             border:1px solid rgba(255,77,90,.35);  color:var(--red); }
.vb-yellow { background: linear-gradient(150deg,#28200d,#181408);
             border:1px solid rgba(255,190,56,.35); color:var(--yellow); }
.vb-green  { background: linear-gradient(150deg,#0c2619,#07180f);
             border:1px solid rgba(53,212,140,.35); color:var(--green); }
.verdict-banner h2   { font-size:28px; font-weight:800; letter-spacing:4px; position:relative; }
.verdict-banner .vc  { color:var(--muted); font-size:12px; margin-top:8px;
                       font-family:'JetBrains Mono'; position:relative; }

.action-hint {
  border-radius:12px; padding:12px 16px; margin-bottom:20px;
  border:1px solid var(--border); background:var(--panel2);
  font-size:12.5px; line-height:1.65; color:var(--muted);
}
.action-hint b { color:var(--text); }

.mini-cards { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
@media(max-width:700px) { .mini-cards { grid-template-columns:repeat(2,1fr); } }
.mini {
  background:var(--panel2); border:1px solid var(--border); border-radius:12px;
  padding:14px; text-align:center;
}
.mini .n { font-size:20px; font-weight:700; margin-bottom:4px; }
.mini .l { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }

.cols2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media(max-width:900px) { .cols2 { grid-template-columns:1fr; } }

.sec-title { font-size:12px; font-weight:700; text-transform:uppercase;
             letter-spacing:.5px; color:var(--muted2); margin-bottom:12px; }

.chart-wrap { position:relative; height:200px; }

.pcinfo { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.pcinfo > div {
  background:var(--panel2); border:1px solid var(--border); border-radius:10px;
  padding:10px; font-size:11px; display:flex; justify-content:space-between;
}
.pcinfo span:first-child { color:var(--muted); }
.pcinfo span:last-child  { color:var(--text); font-weight:600; }

.findings { display:flex; flex-direction:column; gap:12px; }

.f-card {
  border-radius:11px; padding:12px; border:1px solid var(--border);
  background:var(--panel2); font-size:11.5px; line-height:1.5;
}
.f-red    { border-color:rgba(255,77,90,.25);   background:rgba(255,77,90,.04); }
.f-yellow { border-color:rgba(255,190,56,.25);  background:rgba(255,190,56,.04); }
.f-info   { border-color:rgba(108,143,255,.25); background:rgba(108,143,255,.04); }
.f-fp     { border-color:rgba(160,168,184,.2);  background:rgba(160,168,184,.03); opacity:.75; }

.f-head { display:flex; gap:8px; margin-bottom:7px; align-items:center; }
.f-tag  { display:inline-flex; align-items:center; gap:4px;
         background:var(--panel); border:1px solid var(--border); border-radius:6px;
         padding:3px 9px; font-weight:600; font-size:10px; }
.f-fp-tag { color:var(--yellow); font-weight:700; font-size:10px; }

.f-card b { display:block; margin-bottom:8px; }
.f-card pre { background:rgba(0,0,0,.2); border-radius:6px; padding:8px;
              font-family:'JetBrains Mono'; font-size:10px; overflow-x:auto;
              white-space:pre-wrap; word-break:break-word; }

.usb-timeline { display:flex; flex-direction:column; gap:8px; }
.usb-event {
  display:flex; align-items:center; gap:10px; font-size:11px;
  padding:8px; background:rgba(0,0,0,.1); border-radius:8px;
}
.usb-dot {
  width:8px; height:8px; border-radius:50%; flex-shrink:0;
}
.usb-dot.on  { background:var(--green); box-shadow:0 0 6px var(--green); }
.usb-dot.off { background:var(--red); box-shadow:0 0 6px var(--red); }
.usb-time { color:var(--muted); font-family:'JetBrains Mono'; font-size:10px; min-width:140px; }
.usb-label {
  font-weight:700; min-width:90px; text-align:center; padding:2px 8px;
  border-radius:6px; font-size:9px; text-transform:uppercase;
  letter-spacing:.3px;
}
.usb-label.on  { background:rgba(53,212,140,.15); color:var(--green); }
.usb-label.off { background:rgba(255,77,90,.15); color:var(--red); }
.usb-msg { flex:1; color:var(--muted); overflow:hidden; text-overflow:ellipsis; }

.empty { text-align:center; color:var(--muted); padding:40px 20px; }

/* ── Code gen ── */
.gen-box {
  display: none; margin: -6px 0 20px; padding: 15px 18px; border-radius: 13px;
  background: linear-gradient(135deg, rgba(108,143,255,0.09), rgba(164,107,255,0.07));
  border: 1px solid rgba(108,143,255,0.28); animation: slideIn .2s ease;
}
@keyframes slideIn { from { opacity:0; transform:translateY(-7px) } to { opacity:1; transform:translateY(0) } }
.gen-code { font-family:'JetBrains Mono'; font-size:20px; font-weight:700;
            letter-spacing:4px; color:var(--blue); }
.gen-hint { color:var(--muted); font-size:11.5px; margin-top:7px; }

/* Custom Windows Alert */
.custom-windows-alert {
  background: linear-gradient(135deg, rgba(255,190,56,0.1), rgba(255,77,90,0.08));
  border: 1px solid rgba(255,190,56,0.3);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 16px;
  font-size: 12px;
}
.custom-windows-alert .title {
  color: var(--yellow);
  font-weight: 700;
  margin-bottom: 6px;
}
.custom-windows-alert .content {
  color: var(--muted);
  line-height: 1.6;
}

/* User Alts */
.user-alts {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-top: 16px;
  font-size: 12px;
}
.user-alts .title {
  color: var(--blue);
  font-weight: 700;
  margin-bottom: 8px;
}
.user-alts .alt-tag {
  display: inline-block;
  background: rgba(108,143,255,0.15);
  border: 1px solid rgba(108,143,255,0.3);
  border-radius: 6px;
  padding: 4px 10px;
  margin: 3px;
  font-size: 11px;
  color: var(--blue);
}

/* Geolocation Badge */
.geo-badge {
  background: rgba(53,212,140,0.1);
  border: 1px solid rgba(53,212,140,0.3);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 11px;
  color: var(--green);
  display: inline-block;
  margin-bottom: 12px;
  font-weight: 600;
}
</style>
</head>
<body>

<!-- ── AUTH SCREEN ── -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h1>🛡 SS Helper</h1>
    <div class="subtitle">Panel de control de escaneos</div>
    <input type="text" id="authUser" placeholder="Usuario" autocomplete="off">
    <input type="password" id="authPass" placeholder="Contraseña" autocomplete="off">
    <button class="btn btn-accent" onclick="authenticate()" style="width:100%;">Iniciar sesión</button>
    <div class="error" id="authError"></div>
  </div>
</div>

<!-- ── MAIN DASHBOARD ── -->
<div class="wrap" id="mainDash" style="display:none;">
  <header>
    <div class="brand">
      <div class="logo">🛡</div>
      <div>
        <h1>SS Dashboard</h1>
        <div class="sub">v3.0 · Screenshare Assistant</div>
      </div>
    </div>
    <div class="user-info">
      👤 <span id="currentUser">Usuario</span>
      <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path>
      </svg>
      <input type="text" id="searchBox" placeholder="Buscar escaneo por código, usuario...">
    </div>
    <button class="btn" onclick="refreshList()">🔄 Actualizar</button>
    <button class="btn btn-accent" onclick="newScan()">⚡ Nuevo escaneo</button>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="list-hd">ESCANEOS RECIENTES</div>
      <div class="list" id="list">
        <div class="empty">Sin escaneos</div>
      </div>
    </div>

    <div id="detail">
      <div class="empty">Selecciona un escaneo para ver los detalles</div>
    </div>
  </div>
</div>

<script>
const MODULE_ICONS = {
  "Archivos": "📁",
  "Procesos": "🔴",
  "Registro": "🔑",
  "DLLs": "⚙️",
  "Java": "☕",
  "Red": "🌐",
  "Inicio": "⚡",
  "Navegador": "🌍",
  "Mods": "📦",
  "Sistema": "💻",
};

let allScans = [];
let currentAuthToken = null;
let currentUserName = null;

// ── AUTENTICACIÓN ──
function authenticate() {
  const user = document.getElementById("authUser").value.trim();
  const pass = document.getElementById("authPass").value;
  
  if (!user || !pass) {
    showAuthError("Usuario y contraseña requeridos");
    return;
  }
  
  // Simulado: en producción esto verificaría con el backend
  // Por ahora, cualquier usuario/pass funciona (demo)
  if (user.length > 0 && pass.length > 0) {
    currentAuthToken = btoa(user + ":" + pass);
    currentUserName = user;
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("mainDash").style.display = "block";
    document.getElementById("currentUser").textContent = user;
    loadAllScans();
  } else {
    showAuthError("Credenciales inválidas");
  }
}

function showAuthError(msg) {
  const el = document.getElementById("authError");
  el.textContent = msg;
  setTimeout(() => { el.textContent = ""; }, 4000);
}

function logout() {
  currentAuthToken = null;
  currentUserName = null;
  document.getElementById("authScreen").classList.remove("hidden");
  document.getElementById("mainDash").style.display = "none";
  document.getElementById("authUser").value = "";
  document.getElementById("authPass").value = "";
}

// ── CARGAR ESCANEOS ──
function loadAllScans() {
  // Simular carga de escaneos (en producción vendrían del backend)
  const stored = localStorage.getItem("ss_scans");
  if (stored) {
    try {
      allScans = JSON.parse(stored);
    } catch (e) {
      allScans = [];
    }
  }
  updateList();
}

function updateList() {
  const list = document.getElementById("list");
  const search = document.getElementById("searchBox").value.toLowerCase();
  
  const filtered = allScans.filter(s => {
    const code = (s.code || "").toLowerCase();
    const user = (s.pc.user || "").toLowerCase();
    return code.includes(search) || user.includes(search);
  });
  
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">Sin escaneos</div>';
    return;
  }
  
  list.innerHTML = filtered.map((s, i) => {
    const verdictColor = s.verdict === "red" ? "🔴" : s.verdict === "yellow" ? "🟡" : "🟢";
    return `
      <div class="item" id="item-${i}" onclick="showDetail(${i})">
        <div class="item-content">
          <div class="code">${verdictColor} ${esc(s.code)}</div>
          <div class="meta">${esc(s.pc.user)} · ${esc(s.timestamp.split('T')[0])}</div>
        </div>
        <button class="delete-btn" onclick="deleteScan(${i}); event.stopPropagation();">✕</button>
      </div>`;
  }).join("");
}

function showDetail(i) {
  document.querySelectorAll(".item").forEach(e => e.classList.remove("active"));
  document.getElementById("item-"+i).classList.add("active");
  const s = allScans[i];
  
  const counts = {red:0, yellow:0, info:0, fp:0};
  (s.findings||[]).forEach(f => {
    if (f.probable_fp) counts.fp++;
    else counts[f.level] = (counts[f.level]||0) + 1;
  });
  
  let customWinAlert = "";
  if (s.extra.custom_windows && s.extra.custom_windows.length) {
    customWinAlert = `
      <div class="custom-windows-alert">
        <div class="title">⚠️ Windows Personalizado Detectado</div>
        <div class="content">
          <strong>Sistema:</strong> ${esc(s.extra.custom_windows.join(", "))}<br>
          <strong>Nota:</strong> Este Windows personalizado puede tener características de seguridad desactivadas.
          Verifica si el usuario es consciente de esto.
        </div>
      </div>`;
  }
  
  let userAltsHtml = "";
  if (s.extra.user_alts && s.extra.user_alts.length) {
    userAltsHtml = `
      <div class="user-alts">
        <div class="title">👤 Cuentas Detectadas</div>
        ${s.extra.user_alts.map(alt => `<span class="alt-tag">${esc(alt)}</span>`).join("")}
      </div>`;
  }
  
  document.getElementById("detail").innerHTML = `
    <div class="geo-badge">🌍 ${esc(s.pc.country || "Unknown")}</div>
    <div class="verdict-banner vb-${s.verdict}">
      <h2>${s.verdict.toUpperCase()}</h2>
      <div class="vc">Código ${esc(s.code)} · ${esc(s.timestamp)}</div>
    </div>
    
    ${customWinAlert}
    
    <div class="action-hint">
      <b>${s.verdict === "red" ? "⚠️ Hay evidencia fuerte de modificaciones." : 
           s.verdict === "yellow" ? "🟡 Hay señales a revisar." : 
           "✓ Sin coincidencias detectadas."}</b>
      ${s.verdict === "red" ? 
        "Cada hallazgo rojo es evidencia de cheats. Revisa la ruta y fecha de cada archivo." :
        s.verdict === "yellow" ?
        "Pregunta al jugador por cada hallazgo antes de sancionar." :
        "No hay indicadores de cheats, pero no implica limpieza total."}
    </div>

    <div class="mini-cards">
      <div class="mini"><div class="n" style="color:var(--red)">${counts.red}</div>
        <div class="l">Hallazgos</div></div>
      <div class="mini"><div class="n" style="color:var(--yellow)">${counts.yellow}</div>
        <div class="l">Sospechoso</div></div>
      <div class="mini"><div class="n" style="color:var(--blue)">${counts.info}</div>
        <div class="l">Info</div></div>
      <div class="mini"><div class="n" style="color:var(--fp)">${counts.fp}</div>
        <div class="l">F.P. Descartados</div></div>
    </div>

    <div class="cols2">
      <div>
        <p class="sec-title">Información del Equipo</p>
        <div class="pcinfo">
          <div><span>PC</span><span>${esc(s.pc.hostname)}</span></div>
          <div><span>Usuario</span><span>${esc(s.pc.user)}</span></div>
          <div><span>Sistema</span><span>${esc(s.pc.os.split('(')[0].trim())}</span></div>
          <div><span>Admin</span><span>${s.admin ? "✓ Sí" : "✗ No"}</span></div>
          <div><span>Duración</span><span>${s.duration}s</span></div>
        </div>
        
        ${userAltsHtml}
        
        ${buildUsbTimeline(s)}
      </div>
      <div>
        <p class="sec-title">Hallazgos</p>
        <div class="findings">
          ${buildFindings(s)}
        </div>
      </div>
    </div>`;
  
  try { drawRadar(s.verdict, counts); } catch(e) {}
}

function buildFindings(s) {
  const all = s.findings || [];
  if (!all.length) return '<div class="empty">Sin hallazgos</div>';
  
  const sorted = [...all].sort((a,b) => {
    if (a.probable_fp !== b.probable_fp) return a.probable_fp ? 1 : -1;
    const order = {red:0, yellow:1, info:2};
    return (order[a.level]||3) - (order[b.level]||3);
  });
  
  return sorted.map(f => {
    const cls = f.probable_fp ? "f-fp" : `f-${f.level}`;
    const icon = MODULE_ICONS[f.module] || "•";
    const fpTag = f.probable_fp ? `<span class="f-fp-tag">⚠️ Probable Falso Positivo</span>` : "";
    const titleColor = f.probable_fp ? "var(--fp)" :
                      f.level === "red" ? "var(--red)" :
                      f.level === "yellow" ? "var(--yellow)" : "var(--muted)";
    return `
      <div class="f-card ${cls}">
        <div class="f-head">
          <span class="f-tag">${icon} ${esc(f.module)}</span>${fpTag}
        </div>
        <b style="color:${titleColor}">${esc(f.title)}</b>
        <pre>${esc(f.detail || "")}</pre>
      </div>`;
  }).join("");
}

function buildUsbTimeline(s) {
  const evts = (s.usb_events || []).slice(0, 25);
  if (!evts.length) return "";
  
  const connected = evts.filter(e => e.e === "CONECTADO").length;
  const disconnected = evts.filter(e => e.e === "DESCONECTADO").length;
  
  const rows = evts.map(e => {
    const on = e.e === "CONECTADO";
    let msg = (e.m || "").replace(/^.*?:/, "").trim();
    if (msg.length > 80) msg = msg.slice(0, 80) + "…";
    return `
      <div class="usb-event">
        <div class="usb-dot ${on ? 'on' : 'off'}"></div>
        <span class="usb-time">${esc(e.t || "")}</span>
        <span class="usb-label ${on ? 'on' : 'off'}">${on ? "↑ CONECTADO" : "↓ DESCONECTADO"}</span>
        <span class="usb-msg">${esc(msg)}</span>
      </div>`;
  }).join("");
  
  return `
    <p class="sec-title" style="margin-top:16px">Historial USB (${evts.length})</p>
    <div style="padding:10px; font-size:11px; color:var(--muted); margin-bottom:8px">
      <span style="color:var(--green)">↑ ${connected} conectados</span> &nbsp;&nbsp;
      <span style="color:var(--red)">↓ ${disconnected} desconectados</span>
    </div>
    <div class="usb-timeline">${rows}</div>`;
}

function drawRadar(verdict, counts) {
  if (typeof Chart === "undefined") return;
  const canvas = document.getElementById("radar");
  if (!canvas) return;
  try {
    const accent = verdict === "red" ? "#ff4d5a" : verdict === "yellow" ? "#ffbe38" : "#35d48c";
    new Chart(canvas.getContext("2d"), {
      type: "radar",
      data: {
        labels: ["Hallazgos", "Sospechoso", "Info"],
        datasets: [{
          label: "Resultado",
          data: [counts.red, counts.yellow, counts.info],
          backgroundColor: accent + "22",
          borderColor: accent,
          borderWidth: 2,
          pointBackgroundColor: accent,
          pointRadius: 4,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { r: {
          angleLines: { color: "rgba(255,255,255,0.07)" },
          grid: { color: "rgba(255,255,255,0.07)" },
          pointLabels: { color: "#828aa0", font: { size: 11, family: "Sora" } },
          ticks: { display: false },
        }},
        plugins: { legend: { display: false } },
      },
    });
  } catch(e) {}
}

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function deleteScan(i) {
  if (confirm("¿Eliminar este escaneo?")) {
    allScans.splice(i, 1);
    localStorage.setItem("ss_scans", JSON.stringify(allScans));
    updateList();
    document.getElementById("detail").innerHTML = '<div class="empty">Selecciona un escaneo para ver los detalles</div>';
  }
}

function refreshList() {
  loadAllScans();
}

function newScan() {

}
